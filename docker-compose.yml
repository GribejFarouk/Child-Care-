services:
  auth_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-childcare_auth}
      POSTGRES_USER: ${AUTH_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-change_me_auth}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  profile_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME:-childcare_profiles}
      POSTGRES_USER: ${PROFILE_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:-change_me_profiles}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - profile_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_profiles"]
      interval: 10s
      timeout: 5s
      retries: 5

  measurements_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MEASUREMENTS_DB_NAME:-childcare_measurements}
      POSTGRES_USER: ${MEASUREMENTS_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${MEASUREMENTS_DB_PASSWORD:-change_me_measurements}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - measurements_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_measurements"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME:-childcare_analytics}
      POSTGRES_USER: ${ANALYTICS_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-change_me_analytics}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${OCR_DB_NAME:-childcare_ocr}
      POSTGRES_USER: ${OCR_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${OCR_DB_PASSWORD:-change_me_ocr}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - ocr_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_ocr"]
      interval: 10s
      timeout: 5s
      retries: 5

  calendar_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CALENDAR_DB_NAME:-childcare_calendar}
      POSTGRES_USER: ${CALENDAR_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${CALENDAR_DB_PASSWORD:-change_me_calendar}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - calendar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_calendar"]
      interval: 10s
      timeout: 5s
      retries: 5

  collaboration_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${COLLABORATION_DB_NAME:-childcare_collaboration}
      POSTGRES_USER: ${COLLABORATION_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${COLLABORATION_DB_PASSWORD:-change_me_collaboration}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - collaboration_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_collaboration"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-childcare_notifications}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-change_me_notifications}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_notifications"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./services/auth_service
    env_file:
      - .env
    environment:
      - AUTH_DB_HOST=auth_db
    depends_on:
      auth_db:
        condition: service_healthy

  profile_service:
    build:
      context: ./services/profile_service
    env_file:
      - .env
    environment:
      - PROFILE_DB_HOST=profile_db
    depends_on:
      profile_db:
        condition: service_healthy

  measurements_service:
    build:
      context: ./services/measurements_service
    env_file:
      - .env
    environment:
      - MEASUREMENTS_DB_HOST=measurements_db
    depends_on:
      measurements_db:
        condition: service_healthy

  analytics_service:
    build:
      context: ./services/analytics_service
    env_file:
      - .env
    environment:
      - ANALYTICS_DB_HOST=analytics_db
    volumes:
      - ./services/analytics_service:/app
    depends_on:
      analytics_db:
        condition: service_healthy

  ocr_service:
    build:
      context: ./services/ocr_service
    env_file:
      - .env
    environment:
      - OCR_DB_HOST=ocr_db
    volumes:
      - ocr_media:/app/media
    depends_on:
      ocr_db:
        condition: service_healthy

  calendar_service:
    build:
      context: ./services/calendar_service
    env_file:
      - .env
    environment:
      - CALENDAR_DB_HOST=calendar_db
    depends_on:
      calendar_db:
        condition: service_healthy

  collaboration_service:
    build:
      context: ./services/collaboration_service
    env_file:
      - .env
    environment:
      - COLLABORATION_DB_HOST=collaboration_db
    depends_on:
      collaboration_db:
        condition: service_healthy

  notification_service:
    build:
      context: ./services/notification_service
    env_file:
      - .env
    environment:
      - NOTIFICATION_DB_HOST=notification_db
    depends_on:
      notification_db:
        condition: service_healthy

  calendar_worker:
    build:
      context: ./services/calendar_service
    command: >
      sh -c "while true; do python manage.py process_reminders; sleep 3600; done"
    env_file:
      - .env
    environment:
      - CALENDAR_DB_HOST=calendar_db
    depends_on:
      calendar_db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - profile_service
      - measurements_service
      - analytics_service
      - ocr_service
      - calendar_service
      - collaboration_service
      - notification_service
      - audit_service
      - assistant_service

  audit_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:-childcare_audit}
      POSTGRES_USER: ${AUDIT_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-change_me_audit}
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit_service:
    build:
      context: ./services/audit_service
    env_file:
      - .env
    environment:
      - AUDIT_DB_HOST=audit_db
    depends_on:
      audit_db:
        condition: service_healthy

  assistant_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ASSISTANT_DB_NAME:-childcare_assistant}
      POSTGRES_USER: ${ASSISTANT_DB_USER:-childcare}
      POSTGRES_PASSWORD: ${ASSISTANT_DB_PASSWORD:-change_me_assistant}
    volumes:
      - assistant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childcare -d childcare_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  assistant_service:
    build:
      context: ./services/assistant_service
    env_file:
      - .env
    environment:
      - ASSISTANT_DB_HOST=assistant_db
      - ASSISTANT_AI_ENABLED=${ASSISTANT_AI_ENABLED:-false}
      - ASSISTANT_PROVIDER=${ASSISTANT_PROVIDER:-gemini}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-gemini-flash-lite-latest}
      - ASSISTANT_DEMO_DATA_ONLY=${ASSISTANT_DEMO_DATA_ONLY:-true}
      - ASSISTANT_TIMEOUT_SECONDS=${ASSISTANT_TIMEOUT_SECONDS:-20}
      - ASSISTANT_MAX_HISTORY_MESSAGES=${ASSISTANT_MAX_HISTORY_MESSAGES:-8}
      - ANALYTICS_INTERNAL_URL=${ANALYTICS_INTERNAL_URL:-http://analytics_service:8000}
      - PROFILE_INTERNAL_URL=${PROFILE_INTERNAL_URL:-http://profile_service:8000}
      - AUDIT_INTERNAL_URL=${AUDIT_INTERNAL_URL:-http://audit_service:8000}
    volumes:
      - ./services/assistant_service:/app
    depends_on:
      assistant_db:
        condition: service_healthy

volumes:
  auth_db_data:
  profile_db_data:
  measurements_db_data:
  analytics_db_data:
  ocr_db_data:
  calendar_db_data:
  collaboration_db_data:
  notification_db_data:
  ocr_media:
  audit_db_data:
  assistant_db_data:
